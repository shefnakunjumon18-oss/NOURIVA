<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NOURIVA • Edit Trainer Profile</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: 'Inter', sans-serif;

            min-height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at 80% 10%,
                    rgba(34,197,94,0.12),
                    transparent 25%
                ),
                linear-gradient(
                    135deg,
                    #031b13,
                    #06271b,
                    #03140e
                );

        }


        .edit-card {

            width: 100%;

            max-width: 850px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 30px;

            padding: 40px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.30);

            backdrop-filter: blur(20px);

        }


        .profile-preview {

            width: 120px;

            height: 120px;

            border-radius: 50%;

            overflow: hidden;

            margin: 0 auto;

            border:
                4px solid rgba(52,211,153,0.35);

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #10b981
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 45px;

            font-weight: 800;

            box-shadow:
                0 15px 40px rgba(34,197,94,0.20);

        }


        .profile-preview img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .upload-label {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-top: 15px;

            padding: 10px 16px;

            border-radius: 12px;

            background:
                rgba(34,197,94,0.10);

            border:
                1px solid rgba(52,211,153,0.20);

            color:
                #6ee7b7;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

        }


        .upload-label:hover {

            background:
                rgba(34,211,153,0.18);

            transform:
                translateY(-2px);

        }


        .form-label {

            display: block;

            color:
                rgba(255,255,255,0.55);

            font-size: 11px;

            font-weight: 600;

            margin-bottom: 8px;

            text-transform: uppercase;

            letter-spacing: 0.07em;

        }


        .form-input {

            width: 100%;

            padding: 13px 15px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid rgba(255,255,255,0.09);

            color: white;

            outline: none;

            font-size: 13px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

        }


        .form-input:focus {

            border-color:
                rgba(52,211,153,0.50);

            background:
                rgba(255,255,255,0.075);

            box-shadow:
                0 0 0 3px rgba(34,197,94,0.08);

        }


        .form-input::placeholder {

            color:
                rgba(255,255,255,0.25);

        }


        textarea.form-input {

            resize: vertical;

            min-height: 130px;

        }


        .form-input option {

            background:
                #06271b;

            color: white;

        }


        .success-message {

            padding: 14px 17px;

            border-radius: 14px;

            background:
                rgba(34,197,94,0.10);

            border:
                1px solid rgba(52,211,153,0.25);

            color:
                #86efac;

            font-size: 13px;

            font-weight: 600;

            text-align: center;

            animation:
                successIn 0.4s ease;

        }


        @keyframes successIn {

            from {

                opacity: 0;

                transform:
                    translateY(-8px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .save-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 13px 24px;

            border-radius: 13px;

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #10b981
                );

            color: white;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

        }


        .save-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 30px rgba(34,197,94,0.25);

        }


        .back-btn {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            padding: 13px 22px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.08);

            color:
                rgba(255,255,255,0.80);

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition: all 0.3s ease;

        }


        .back-btn:hover {

            background:
                rgba(52,211,153,0.10);

            color:
                #6ee7b7;

        }

    </style>

</head>


<body>


<div class="min-h-screen flex items-center justify-center p-6">


    <div class="edit-card">


        <!-- HEADER -->

        <div class="text-center mb-8">


            <p class="text-emerald-400 text-xs font-bold uppercase tracking-[0.25em] mb-2">

                NOURIVA Trainer

            </p>


            <h1 class="text-3xl md:text-4xl font-extrabold">

                Edit Profile

            </h1>


            <p class="text-white/40 text-sm mt-2">

                Keep your trainer information up to date.

            </p>


        </div>



        <!-- SUCCESS MESSAGE -->

        {% if success %}

            <div class="success-message mb-7">

                <i class="fa-solid fa-circle-check mr-2"></i>

                {{ success }}

            </div>

        {% endif %}



        <!-- FORM -->

        <form
            action="/trainer_edit_profile"
            method="POST"
            enctype="multipart/form-data">


            <!-- =================================
                 PROFILE PHOTO
            ================================== -->

            <div class="text-center mb-9">


                <div class="profile-preview">


                    {% if trainer.photo %}

                        <img
                            id="profilePreview"
                            src="{{ url_for('static', filename='uploads/' ~ trainer.photo) }}"
                            alt="{{ trainer.name }}">

                    {% else %}

                        <span id="profileLetter">

                            {{ (trainer.name or 'T')[0]|upper }}

                        </span>

                        <img
                            id="profilePreview"
                            src=""
                            alt="Profile Preview"
                            style="display:none;">

                    {% endif %}


                </div>


                <label
                    for="photo"
                    class="upload-label">


                    <i class="fa-solid fa-camera"></i>


                    Change Profile Photo


                </label>


                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                    class="hidden">


                <p class="text-xs text-white/30 mt-2">

                    JPG, PNG or WEBP

                </p>


            </div>



            <!-- =================================
                 BASIC DETAILS
            ================================== -->

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                <!-- NAME -->

                <div>

                    <label class="form-label">

                        Trainer Name

                    </label>

                    <input
                        type="text"
                        value="{{ trainer.name }}"
                        class="form-input"
                        disabled>

                </div>



                <!-- EMAIL -->

                <div>

                    <label class="form-label">

                        Email

                    </label>

                    <input
                        type="email"
                        value="{{ trainer.email }}"
                        class="form-input"
                        disabled>

                </div>



                <!-- PHONE -->

                <div>

                    <label
                        for="phone"
                        class="form-label">

                        Phone

                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ trainer.phone or '' }}"
                        placeholder="Enter phone number"
                        class="form-input">

                </div>



                <!-- SPECIALIZATION -->

                <div>

                    <label
                        for="specialization"
                        class="form-label">

                        Specialization

                    </label>

                    <input
                        type="text"
                        id="specialization"
                        name="specialization"
                        value="{{ trainer.specialization or '' }}"
                        placeholder="Eg. Fitness & Nutrition"
                        class="form-input">

                </div>



                <!-- EXPERIENCE -->

                <div>

                    <label
                        for="experience"
                        class="form-label">

                        Experience

                    </label>

                    <input
                        type="number"
                        id="experience"
                        name="experience"
                        min="0"
                        value="{{ trainer.experience or '' }}"
                        placeholder="Years of experience"
                        class="form-input">

                </div>



                <!-- CERTIFICATE -->

                <div>

                    <label
                        for="certificate_name"
                        class="form-label">

                        Certificate

                    </label>

                    <input
                        type="text"
                        id="certificate_name"
                        name="certificate_name"
                        value="{{ trainer.certificate_name or '' }}"
                        placeholder="Certificate name"
                        class="form-input">

                </div>


            </div>



            <!-- =================================
                 BIO
            ================================== -->

            <div class="mt-5">


                <label
                    for="bio"
                    class="form-label">

                    About You

                </label>


                <textarea
                    id="bio"
                    name="bio"
                    placeholder="Tell your clients about yourself..."
                    class="form-input">{{ trainer.bio or '' }}</textarea>


            </div>



            <!-- =================================
                 BUTTONS
            ================================== -->

            <div class="flex flex-col sm:flex-row gap-3 mt-8">


                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>


                <a
                    href="/trainer_profile"
                    class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Cancel

                </a>


            </div>


        </form>


    </div>


</div>



<!-- =========================================
     PHOTO PREVIEW
========================================= -->

<script>

    const photoInput = document.getElementById("photo");

    const preview = document.getElementById("profilePreview");

    const letter = document.getElementById("profileLetter");


    photoInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }


        const reader = new FileReader();


        reader.onload = function (event) {

            preview.src = event.target.result;

            preview.style.display = "block";


            if (letter) {

                letter.style.display = "none";

            }

        };


        reader.readAsDataURL(file);

    });

</script>


</body>

</html>
